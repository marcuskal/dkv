global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Local 3-node dev cluster (make run-node1/2/3).
  # Each node's health server also serves /metrics.
  - job_name: "quoll-local"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9093"]
        labels:
          node: "node-1"
      - targets: ["host.docker.internal:9095"]
        labels:
          node: "node-2"
      - targets: ["host.docker.internal:9096"]
        labels:
          node: "node-3"
