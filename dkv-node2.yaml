data_dir: ./data-node2
log_level: info

engine:
  wal_dir: ./data-node2/wal
  wal_sync_mode: always
  max_key_size: 1024
  max_value_size: 1048576

grpc:
  listen_addr: ":50052"
  request_timeout: 5s

tls:
  enabled: false
  cert_file: ""
  key_file: ""
  ca_file: ""
  mtls_enabled: false

raft:
  node_id: "node-2"
  bind_addr: "127.0.0.1:7001"
  data_dir: ./data-node2/raft
  bootstrap: false
  heartbeat_timeout: 1s
  election_timeout: 1s
  leader_lease_timeout: 500ms
  commit_timeout: 50ms
  snapshot_interval: 30s
  snapshot_threshold: 8192
  trailing_logs: 10240

serf:
  node_name: "node-2"
  bind_addr: "127.0.0.1:7947"
  tags:
    role: "voter"
  join_addrs:
    - "127.0.0.1:7946"

hashring:
  vnode_count: 64

observability:
  metrics_addr: ":9092"
  tracing_endpoint: "localhost:4318"
  sample_rate: 1.0
  stats_interval: 5s
