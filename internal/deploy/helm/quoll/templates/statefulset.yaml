apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quoll.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quoll.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "quoll.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "quoll.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quoll.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Force pod restart on ConfigMap changes — without this, a `helm
        # upgrade` that only changes the ConfigMap won't trigger any pod
        # rotation, and pods keep using the old config until they
        # restart for some other reason.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "quoll.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: quoll
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args: ["--config", "/etc/quoll/quoll.yaml"]

          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: grpc
              containerPort: 9090
            - name: raft
              containerPort: 9091
            - name: serf-tcp
              containerPort: 9092
              protocol: TCP
            - name: serf-udp
              containerPort: 9092
              protocol: UDP
            - name: health
              containerPort: 9093

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HEADLESS_SVC
              value: {{ include "quoll.headlessServiceName" . }}
            - name: CLUSTER_DOMAIN
              value: {{ include "quoll.clusterDomain" . }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          lifecycle:
            preStop:
              exec:
                # Sleep gives kube-proxy time to drain endpoints. Real
                # graceful-leave logic runs in main.go's SIGTERM handler.
                command: ["/bin/sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
                # NOTE: distroless/static has no /bin/sh — replace with a
                # short Go subcommand `quoll leave` if using distroless.

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/quoll
            - name: config
              mountPath: /etc/quoll
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: {{ include "quoll.fullname" . }}-config

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}