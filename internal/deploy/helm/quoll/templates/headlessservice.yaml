# Headless Service — peer discovery via per-pod DNS records.
# Required by the StatefulSet's `serviceName` field.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quoll.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quoll.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Critical: peers must be resolvable BEFORE they're Ready, otherwise
  # the cluster can never form quorum (chicken-and-egg).
  publishNotReadyAddresses: true
  selector:
    {{- include "quoll.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: 9090
    - name: raft
      port: 9091
    - name: serf-tcp
      port: 9092
      protocol: TCP
    - name: serf-udp
      port: 9092
      protocol: UDP