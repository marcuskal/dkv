# Client-facing Service — load-balances gRPC across all pods.
# The pod-side router forwards mis-shard requests to the correct owner.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dkv.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dkv.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dkv.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc